<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1218" />
    <title>ROPPONGI CHRONICLES / 編選択</title>
    <link rel="stylesheet" href="launcher.css?edition=3" />
  </head>
  <body>
    <main class="launcher">
      <header>
        <p>ROPPONGI CHRONICLES</p>
        <h1>物語の時代を選択</h1>
        <span>同じ六本木の地形を、二つの時代から探索します。</span>
      </header>

      <section class="versions" aria-label="物語の時代">
        <a class="version-card current modern-card" href="v2.html?edition=modern">
          <div class="badge">MODERN · DAY</div>
          <h2>現代編-昼間</h2>
          <p>現在の六本木を舞台に、主要道路とランドマークを巡る昼間の探索編です。</p>
          <strong>現代編を開く →</strong>
        </a>

        <article class="version-card past-card">
          <div class="badge">PAST · EVENING</div>
          <h2>過去編-夕方</h2>
          <p>同じ道筋が石畳となり、王城・魔導学院・大聖堂が並ぶ剣と魔法の時代です。</p>
          <div class="version-actions">
            <a class="version-action" href="v2.html?edition=past">つづきから</a>
            <a class="version-action restart" href="v2.html?edition=past&amp;newGame=past">はじめから</a>
          </div>
          <small>「はじめから」は過去編のセーブデータを初期化します。</small>
        </article>
      </section>
    </main>
  </body>
</html>
