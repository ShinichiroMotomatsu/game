name: Publish game to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the game
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare browser-only site
        run: node scripts/build-pages-site.js .pages-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.pages-site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
