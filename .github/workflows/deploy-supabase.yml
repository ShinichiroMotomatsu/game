name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to apply pending migrations to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
      - name: Link project for this runner
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push --yes
