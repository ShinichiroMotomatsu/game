name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Supabase browser bundle
        run: |
          npm run build:supabase-client
          git diff --exit-code -- v2-supabase-bundle.js
      - name: Run tests with local mocks
        run: npm test
      - name: Audit production dependencies
        run: npm audit --audit-level=high
